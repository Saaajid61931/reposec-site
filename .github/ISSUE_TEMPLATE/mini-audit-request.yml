name: Repo Security Mini-Audit request
description: Request a passive INR 499 repo security mini-audit preview.
title: "Repo Security Mini-Audit request: "
labels:
  - mini-audit
body:
  - type: markdown
    attributes:
      value: |
        Use this only for a public repo or app folder you own or have permission to submit.
        This is a passive review only: no login testing, production probing, bypass help, malware, credential handling, or private-secret sharing.
  - type: input
    id: repo_link
    attributes:
      label: Repo link
      description: Paste a public GitHub repo URL or a safe share link for the app folder.
      placeholder: "https://github.com/owner/repo"
    validations:
      required: true
  - type: checkboxes
    id: permission
    attributes:
      label: Permission and scope
      options:
        - label: I own this repo or have permission to request this passive review.
          required: true
        - label: Passive repo review only is okay.
          required: true
        - label: I will not share passwords, OTPs, UPI PINs, private keys, or real secrets.
          required: true
  - type: dropdown
    id: goal
    attributes:
      label: Main concern
      options:
        - Dependency and lockfile risk
        - Exposed-secret patterns
        - GitHub Actions permissions
        - SECURITY.md / Dependabot hygiene
        - Overall repo launch safety
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional context about the repo, stack, or what you want checked first.
      placeholder: "Node/Next.js app, public portfolio repo, about to deploy..."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Sajid will send a small useful preview first. If the preview is useful, the final checklist/report is INR 499 by UPI.
