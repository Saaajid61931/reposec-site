services:
  scanner-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env.worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp/reposec:rw,noexec,nosuid,nodev,size=512m,mode=0700
    volumes:
      - trivy-cache:/var/lib/reposec/trivy
      - semgrep-state:/var/lib/reposec/semgrep
      - scanner-cache:/var/lib/reposec/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 32m

volumes:
  trivy-cache:
  semgrep-state:
  scanner-cache:
